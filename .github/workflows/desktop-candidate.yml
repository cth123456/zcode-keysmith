# Unsigned desktop candidate: artifacts only. No tag, no GitHub Release,
# no signing secrets. Sidecar is built from this checkout's CLI (VERSION),
# not from the Latest zip. Default branch is master.
#
# macOS: ad-hoc codesign only, no Developer ID / notarization.
# Windows: no Authenticode. No Linux / Intel Mac / auto-update.
name: Desktop Candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop-candidate.yml"
      - "VERSION"
      - "examples/**"
      - "zcode-keysmith.py"
      - "gui/**"

permissions:
  contents: read

concurrency:
  group: desktop-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.14.0"
  PYTHON_VERSION: "3.12.9"
  PYINSTALLER_VERSION: "6.16.0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  ZCODE_KEYSMITH_SOURCE_COMMIT: ${{ github.sha }}

jobs:
  candidate:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon macOS / DMG
            os: macos-15
            target: aarch64-apple-darwin
          - label: Windows x64 / NSIS
            os: windows-2025
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Set up Rust
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --target "$TARGET_TRIPLE"
          rustup default stable
          rustup component add rustfmt
          rustc --version
          cargo --version

      - name: Frontend and Python gates
        working-directory: gui
        shell: bash
        env:
          HOME: ${{ runner.temp }}/isolated-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          npm ci
          npm test
          npm run build
          python -m pip install "pytest==8.4.2"
          (cd .. && python -m pytest -p no:cacheprovider -q tests)

      - name: Native sidecar and Tauri
        working-directory: gui
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          python -m pip install -r requirements-build.txt
          npm run bundle

      - name: Validate macOS candidate
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(gui/src-tauri/target/release/bundle/macos/*.app)
          dmgs=(gui/src-tauri/target/release/bundle/dmg/*.dmg)
          if [ "${#apps[@]}" -ne 1 ] || [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS app and DMG candidate." >&2
            exit 1
          fi
          app="${apps[0]}"
          # Tauri 2 names the Mach-O after the Cargo package (`zcode-keysmith-gui`),
          # not productName (`zcode-keysmith`). The .app / DMG still use productName.
          gui_bin="$app/Contents/MacOS/zcode-keysmith-gui"
          sidecar="$app/Contents/MacOS/zcode-keysmith-cli"
          test -x "$gui_bin"
          test -x "$sidecar"
          file "$gui_bin" | grep -F "arm64"
          file "$sidecar" | grep -F "arm64"
          expected="$(cat VERSION)"
          "$sidecar" --version | grep -F "$expected"

          smoke_root="$(mktemp -d "${RUNNER_TEMP}/zcode-keysmith-sidecar-smoke.XXXXXX")"
          launch_agent="$smoke_root/com.jia.zcode-keysmith.env.plist"
          # doctor exits 1 when the temp dir is empty. That is the contract,
          # not a broken sidecar. Only the schema and the path check matter.
          doctor_output="$("$sidecar" doctor --json \
            --managed-dir "$smoke_root" \
            --launch-agent "$launch_agent" \
            --zcode-runtime "$smoke_root/zcode.cjs" \
            --node-command "$smoke_root/node" || true)"
          printf '%s\n' "$doctor_output" | grep -F '"schema": "zcode-keysmith/v1"'
          if printf '%s\n' "$doctor_output" | grep -F "/Library/LaunchAgents/com.jia.zcode-keysmith.env.plist"; then
            echo "doctor --json probed the live LaunchAgent; refusing the candidate." >&2
            exit 1
          fi
          rm -rf "$smoke_root"

          # codesign --verify fails these ad-hoc Mach-Os with
          # "code has no resources but signature indicates they must be present".
          # That is how the unsigned candidate is signed. Require ad-hoc and
          # do not treat the resources mismatch as a signed-release failure.
          gui_sign="$(codesign -dv --verbose=4 "$gui_bin" 2>&1 || true)"
          side_sign="$(codesign -dv --verbose=4 "$sidecar" 2>&1 || true)"
          printf '%s\n' "$gui_sign" | grep -F "Signature=adhoc"
          printf '%s\n' "$side_sign" | grep -F "Signature=adhoc"
          if printf '%s\n' "$gui_sign" "$side_sign" | grep -F "Authority="; then
            echo "candidate must stay ad-hoc; found an Authority." >&2
            exit 1
          fi

      - name: Validate Windows candidate
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "windows candidate validation starting"
          $bundles = @(
            Get-ChildItem -LiteralPath "gui/src-tauri/target/release/bundle/nsis" `
              -Filter "*.exe" -File
          )
          if ($bundles.Count -ne 1) { throw "Expected exactly one NSIS candidate." }

          $installDir = Join-Path $env:RUNNER_TEMP "zcode-keysmith-candidate-install"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "zcode-keysmith-sidecar-smoke"
          $installed = $false
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          function Assert-X64Executable([string]$Path) {
            $stream = [System.IO.File]::OpenRead($Path)
            $reader = [System.IO.BinaryReader]::new($stream)
            try {
              $stream.Position = 0x3c
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset + 4
              $machine = $reader.ReadUInt16()
              if ($machine -ne 0x8664) {
                throw "Expected x64 PE executable: $Path"
              }
            }
            finally {
              $reader.Dispose()
              $stream.Dispose()
            }
          }

          try {
            $installerSignature = (Get-AuthenticodeSignature -LiteralPath $bundles[0].FullName).Status.ToString()
            if ($installerSignature -ne "NotSigned") {
              throw "candidate must remain unsigned; installer signature is $installerSignature"
            }

            Write-Host "installing $($bundles[0].FullName) into $installDir"
            $installer = Start-Process -FilePath $bundles[0].FullName `
              -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
            Write-Host "installer exit $($installer.ExitCode)"
            if ($installer.ExitCode -ne 0) {
              throw "NSIS candidate installation failed with exit code $($installer.ExitCode)."
            }
            $installed = $true
            Write-Host "installed files:"
            Get-ChildItem -LiteralPath $installDir -Recurse -File | ForEach-Object { Write-Host $_.FullName }

            # Installed GUI follows the Cargo package name, not productName.
            $apps = @(
              Get-ChildItem -LiteralPath $installDir -Recurse `
                -Filter "zcode-keysmith-gui.exe" -File
            )
            $sidecars = @(
              Get-ChildItem -LiteralPath $installDir -Recurse `
                -Filter "zcode-keysmith-cli.exe" -File
            )
            if ($apps.Count -ne 1 -or $sidecars.Count -ne 1) {
              throw "Installed NSIS payload must contain one GUI and one sidecar executable."
            }
            Assert-X64Executable $apps[0].FullName
            Assert-X64Executable $sidecars[0].FullName

            $expected = (Get-Content VERSION -Raw).Trim()
            $versionOutput = & $sidecars[0].FullName --version 2>&1
            if ($LASTEXITCODE -ne 0 -or "$versionOutput" -notmatch [regex]::Escape($expected)) {
              throw "Installed sidecar version smoke failed: $versionOutput"
            }

            New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
            $launchAgent = Join-Path $smokeRoot "com.jia.zcode-keysmith.env.plist"
            # An empty dir is not installed, so doctor exits 1. Start-Process
            # keeps that code off pwsh's error stream. The schema check below
            # is what decides.
            $doctorFile = Join-Path $smokeRoot "doctor.json"
            $doctorErr = Join-Path $smokeRoot "doctor.err"
            $doctorProc = Start-Process -FilePath $sidecars[0].FullName -ArgumentList @(
              "doctor", "--json",
              "--managed-dir", $smokeRoot,
              "--launch-agent", $launchAgent,
              "--zcode-runtime", (Join-Path $smokeRoot "zcode.cjs"),
              "--node-command", (Join-Path $smokeRoot "node")
            ) -Wait -PassThru -RedirectStandardOutput $doctorFile -RedirectStandardError $doctorErr
            $doctorExit = $doctorProc.ExitCode
            $doctorText = ""
            if (Test-Path -LiteralPath $doctorFile) { $doctorText += Get-Content -LiteralPath $doctorFile -Raw }
            if (Test-Path -LiteralPath $doctorErr) { $doctorText += Get-Content -LiteralPath $doctorErr -Raw }
            Write-Host "doctor exit $doctorExit"
            Write-Host $doctorText
            if ($doctorText -notmatch '"schema": "zcode-keysmith/v1"') {
              throw "Installed sidecar doctor --json smoke failed (exit $doctorExit): $doctorText"
            }
            if ($doctorText -match [regex]::Escape("\Library\LaunchAgents\com.jia.zcode-keysmith.env.plist") -or
                $doctorText -match "/Library/LaunchAgents/com.jia.zcode-keysmith.env.plist") {
              throw "doctor --json probed the live LaunchAgent; refusing the candidate."
            }

            foreach ($unsignedFile in @($apps[0].FullName, $sidecars[0].FullName)) {
              $status = (Get-AuthenticodeSignature -LiteralPath $unsignedFile).Status.ToString()
              if ($status -ne "NotSigned") {
                throw "candidate must remain unsigned; $unsignedFile signature is $status"
              }
            }
          }
          finally {
            $cleanupError = $null
            if ($installed) {
              try {
                $uninstallers = @(
                  Get-ChildItem -LiteralPath $installDir -Recurse `
                    -Filter "uninstall*.exe" -File -ErrorAction SilentlyContinue
                )
                if ($uninstallers.Count -ne 1) {
                  throw "Installed NSIS candidate must contain exactly one uninstaller."
                }
                $uninstaller = Start-Process -FilePath $uninstallers[0].FullName `
                  -ArgumentList "/S" -Wait -PassThru
                if ($uninstaller.ExitCode -ne 0) {
                  throw "NSIS candidate uninstall failed with exit code $($uninstaller.ExitCode)."
                }
              }
              catch {
                $cleanupError = $_.Exception.Message
              }
            }
            Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
            if ($null -ne $cleanupError) { throw $cleanupError }
          }

      - name: Upload macOS candidate
        if: matrix.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zcode-keysmith-macos-aarch64
          path: gui/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Windows candidate
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zcode-keysmith-windows-x64
          path: gui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
